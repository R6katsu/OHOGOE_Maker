<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>オホ声メーカー</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
    }
    textarea {
      width: 100%;
      height: 150px;
    }
    #output {
      margin-top: 1rem;
      white-space: pre-wrap;
      background: #f0f0f0;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <h1>オホ声メーカー</h1>
  <p>テキストを入力するとオホ声に変換します。</p>
  <textarea id="input" placeholder="ここにテキストを入力"></textarea>
  <br>
  <button id="convert">変換</button>
  <div id="output"></div>
  <script>
    function toOhoVoice(str) {
      const vowels = 'aeiouAEIOUあいうえおアイウエオぁぃぅぇぉァィゥェォ';
      let result = '';
      for (const ch of str) {
        if (vowels.includes(ch)) {
          result += 'オホ';
        } else {
          result += ch;
        }
      }
      return result;
    }

    document.getElementById('convert').addEventListener('click', () => {
      const input = document.getElementById('input').value;
      const output = toOhoVoice(input);
      document.getElementById('output').textContent = output;
    });
  </script>
</body>
</html>
