<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>オホ声メーカー</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 2rem;
    }
    textarea {
      width: 100%;
      height: 150px;
    }
    #output {
      margin-top: 1rem;
      white-space: pre-wrap;
      background: #f0f0f0;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <h1>オホ声メーカー</h1>
  <p>テキストを入力すると末尾に促音とハートを追加します。</p>
  <textarea id="input" placeholder="ここにテキストを入力"></textarea>
  <br>
  <button id="convert">変換</button>
  <div id="output"></div>
  <script>
    function addDakuten(str) {
      const voiceless = new Set([
        'か','き','く','け','こ','さ','し','す','せ','そ',
        'た','ち','つ','て','と','は','ひ','ふ','へ','ほ',
        'カ','キ','ク','ケ','コ','サ','シ','ス','セ','ソ',
        'タ','チ','ツ','テ','ト','ハ','ヒ','フ','ヘ','ホ',
        'っ','ッ'
      ]);
      return Array.from(str).map(ch => {
        const d = ch.normalize('NFD');
        if (d.includes('\u3099') || d.includes('\u309A') || voiceless.has(ch)) {
          return ch;
        }
        return ch + '゛';
      }).join('');
    }

    function toOhoVoice(str) {
      const base = addDakuten(str);
      const hearts = Math.floor(Math.random() * 3) + 1;
      return base + 'っ' + '♡'.repeat(hearts);
    }

    document.getElementById('convert').addEventListener('click', () => {
      const input = document.getElementById('input').value;
      const output = toOhoVoice(input);
      document.getElementById('output').textContent = output;
    });
  </script>
</body>
</html>
